<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Action Leap · 学员填写</title>
<link rel="stylesheet" href="styles.css?v=19" />
<style>
  .c2 { background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0;box-shadow:var(--shadow-sm); }
  .c2 .hd { display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px; }
  .c2 .tt { font-size:16px;font-weight:800;letter-spacing:-.01em; }
  .c2 .task { font-size:13px;color:var(--ink-soft);line-height:1.65;margin:6px 0 0; }
  .c2 .sec { border-top:1px solid var(--line);margin-top:16px;padding-top:14px; }
  .c2 .lb { font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--primary-d);margin-bottom:10px; }
  .c2 .lb.done { color:var(--indigo); }
  .c2 label { display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--ink); }
  .c2 input,.c2 textarea { width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-soft);color:var(--ink); }
  .c2 input:focus,.c2 textarea:focus { outline:2px solid rgba(255,122,77,.28);border-color:var(--primary); }
  .c2 .hint { display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-faint);margin:5px 0 0;line-height:1.55; }
  .c2 .hint span { flex:1; }
  .c2 .hint button { flex:none;border:0;background:var(--indigo-soft);color:var(--indigo);font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;cursor:pointer; }
  .c2 .nums { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px; }
  .c2 .nums label { margin-top:2px; }
  .c2 .old { font-size:13px;color:var(--ink-soft);margin-top:4px; }
  .c2 .old b { color:var(--ink); }
  @media (max-width:560px){ .c2 .nums { grid-template-columns:1fr; } .c2 { padding:16px; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span>Action Leap<small>课后学习迁移 · 学员填写</small></div>
</div>

<div class="wrap">
  <section id="view-err" class="hidden">
    <div class="card"><div class="empty" id="errMsg">链接无效或已失效。</div></div>
  </section>

  <section id="view-main" class="hidden">
    <div class="hero">
      <div class="eyebrow" id="hClient">课程</div>
      <h1 id="hTitle">课后迁移表</h1>
      <p id="hStudent"></p>
    </div>

    <div class="card hidden" id="timelineCard">
      <div class="eyebrow">课后迁移时间线</div>
      <div id="timelineBar" class="timeline"></div>
      <div id="timelineNow"></div>
    </div>

    <div class="card">
      <div class="eyebrow">怎么填（第一次约 3 分钟，之后每周 30 秒）</div>
      <p class="meta">讲师只给<b>工具方法</b>和<b>主题任务</b>，旁边两句提示只是启发，可以改、也可以不用。</p>
      <p class="meta">四张卡由你自己定：<b>① 在什么工作场景下　② 改善什么行为　③ 做成了什么　④ 改善哪个指标</b>（现在是多少 → 想变成多少 → 实际做到多少）。</p>
      <p class="meta">先定下 ①②④，做完再回来补 ③ 和实际值。四张卡都填完才能提交；你的上司会先看到你定的方向。</p>
    </div>

    <div class="card">
      <div class="eyebrow" id="cardsTitle">我的行动卡</div>
      <div id="fillBody"></div>
      <div id="fillErr" class="error"></div>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn" id="btnSubmit">提交迁移</button>
        <button class="btn ghost" id="btnSave">保存草稿</button>
      </div>
      <div id="doneBox" class="note hidden"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="publicConfig.js?v=19"></script>
<script src="cloud-core.js?v=19"></script>
<script>
(function () {
  'use strict';
  var A = window.ALC;
  if (typeof WorkBuddyCloud === 'undefined') { showErr('云服务 SDK 加载失败，请刷新重试。'); return; }
  A.init();

  var q = new URLSearchParams(location.search);
  var pid = q.get('pid'), tok = q.get('tok');
  var data = null;
  var rows = [];          // 每张卡：新旧两种结构并存，见 buildRows

  function $(id) { return document.getElementById(id); }
  function showErr(m) { $('errMsg').textContent = m; $('view-err').classList.remove('hidden'); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

  if (!pid || !tok) { showErr('链接缺少必要参数。'); return; }

  A.getProjectForStudent(pid, tok).then(function (r) {
    if (!r || !r.ok) { showErr('链接无效或已失效（' + ((r && r.error) || '未知') + '）。'); return; }
    data = r;
    buildRows();
    buildExisting(r.submission);
    render();
    $('view-main').classList.remove('hidden');
  }).catch(function (e) { showErr('加载失败：' + (e.message || e)); });

  /* 新卡：四项由学员写，讲师只给 method / task / 两句提示 / 指标方向。
   * 旧卡（两期测试数据）：保留讲师预设的场景与行动，学员仍只补结果与实际值。 */
  function buildRows() {
    rows = (data.framework || []).map(function (a) {
      if (A.isNewRow(a)) {
        return { id: a.id, v: 2, method: a.method || '', task: a.task || '',
          hintScene: a.hintScene || '', hintBehavior: a.hintBehavior || '',
          direction: a.direction || 'efficiency',
          scene: '', behavior: '', metricName: '', unit: '', baseline: '', goal: '',
          resultImpact: '', quantActual: '' };
      }
      return { id: a.id, section: a.section || '', scene: a.scene || '', action: a.action || '',
        target: a.target || '', direction: a.direction || 'up', note: a.note || '',
        resultImpact: '', quantActual: '', difficulty: '', futureApplication: '' };
    });
  }
  function buildExisting(sub) {
    if (!sub || !sub.rows) return;
    sub.rows.forEach(function (s) {
      var r = rows.find(function (x) { return x.id === s.id; });
      if (!r) return;
      if (A.isNewRow(r)) {
        ['scene', 'behavior', 'metricName', 'unit', 'baseline', 'goal', 'resultImpact', 'quantActual']
          .forEach(function (f) { r[f] = s[f] != null ? s[f] : ''; });
      } else {
        r.resultImpact = s.resultImpact || '';
        r.quantActual = s.quantActual != null ? s.quantActual : '';
        r.difficulty = s.difficulty || '';
        r.futureApplication = s.futureApplication || '';
      }
    });
  }

  function renderTimeline(schedule, role) {
    if (!schedule || !schedule.startDate) return;
    var info = A.phaseInfo({ schedule: schedule });
    if (!info) return;
    var HINTS = {
      student: { fill: '现在该：先定下自己的四张卡（场景 / 行为 / 指标）', sup: '现在该：上司正在看你定的方向，可先推进工作', submit: '现在该：补完「做成了什么」和实际值后正式提交', review: '现在该：等待讲师评价与案例评选' },
      sup: { fill: '现在该：等待学员定卡并填写成果', sup: '现在该：给学员写三段式反馈（评语 / 建议 / 承诺跟进）', submit: '现在该：如还有补充可继续完善反馈', review: '现在该：等待讲师评价' }
    };
    $('timelineCard').classList.remove('hidden');
    var bar = $('timelineBar'); bar.innerHTML = '';
    info.phases.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'ph ' + p.status;
      d.innerHTML = '<div class="pn">第 ' + (p.index + 1) + ' 阶段</div><div class="pl">' + A.esc(p.label) + '</div><div class="pw">' + p.weeks + ' 周 · ' + p.startStr + '~' + p.endStr + '</div>';
      bar.appendChild(d);
    });
    var now = $('timelineNow');
    if (info.closed) { now.className = 'tl-closed'; now.textContent = '✓ 本项目已收尾。'; }
    else if (info.ended) { now.className = 'tl-closed'; now.textContent = '全部阶段已结束。'; }
    else if (info.currentIndex < 0) { now.className = 'tl-now'; now.textContent = '时间线尚未开始（开始日 ' + info.startStr + '）。'; }
    else {
      now.className = 'tl-now';
      var h = (HINTS[role] || {})[info.phases[info.currentIndex].key] || '';
      now.innerHTML = '当前：第 ' + (info.currentIndex + 1) + ' 阶段 · <b>' + A.esc(info.currentLabel) + '</b>　' + A.esc(h);
    }
  }

  function field(i, f, tag, value, placeholder, extra) {
    var v = A.esc(value == null ? '' : value);
    if (tag === 'textarea') {
      return '<textarea data-i="' + i + '" data-f="' + f + '" rows="2" placeholder="' + A.esc(placeholder) + '">' + v + '</textarea>';
    }
    return '<input data-i="' + i + '" data-f="' + f + '" value="' + v + '" placeholder="' + A.esc(placeholder) + '"' + (extra || '') + '>';
  }
  function hintRow(i, f, text) {
    if (!text) return '';
    return '<div class="hint"><span>提示：' + A.esc(text) + '</span>' +
      '<button type="button" data-i="' + i + '" data-hint="' + f + '">用这句</button></div>';
  }

  function newCardHTML(r, i) {
    var h = '<div class="hd"><span class="pill">第 ' + (i + 1) + ' 张卡 · ' + A.esc(A.directionLabel(r.direction)) + '</span>' +
      '<span class="tt">' + A.esc(r.method || '工具方法') + '</span></div>' +
      '<p class="task">主题任务：' + A.esc(r.task || '把这套方法用到你自己的岗位上') + '</p>';

    h += '<div class="sec"><div class="lb">第 1 周 · 先定这张卡（约 3 分钟）</div>';
    h += '<label>① 在什么工作场景下</label>';
    h += field(i, 'scene', 'input', r.scene, '写你自己的真实工作场景，例如：每周二和供应链对齐交付计划');
    h += hintRow(i, 'scene', r.hintScene);
    h += '<label>② 改善什么行为</label>';
    h += field(i, 'behavior', 'input', r.behavior, '你打算把原来的做法改成什么');
    h += hintRow(i, 'behavior', r.hintBehavior);
    h += '<label>④ 改善哪个指标</label>';
    h += field(i, 'metricName', 'input', r.metricName, '例：跨部门方案定稿天数');
    h += '<div class="nums">' +
      '<div><label>现在是多少</label>' + field(i, 'baseline', 'input', r.baseline, '12', ' inputmode="decimal"') + '</div>' +
      '<div><label>想变成多少</label>' + field(i, 'goal', 'input', r.goal, '8', ' inputmode="decimal"') + '</div>' +
      '<div><label>单位（可选）</label>' + field(i, 'unit', 'input', r.unit, '天 / % / 次') + '</div>' +
      '</div></div>';

    h += '<div class="sec"><div class="lb done">做完再回来补 · 30 秒</div>';
    h += '<label>③ 做成了什么</label>';
    h += field(i, 'resultImpact', 'textarea', r.resultImpact, '一两句话说清楚结果；做不成也照实写卡在哪');
    h += '<label>实际值</label>';
    h += field(i, 'quantActual', 'input', r.quantActual, '填数字', ' inputmode="decimal"');
    h += '</div>';
    return h;
  }

  function legacyCardHTML(r, i) {
    var quantified = r.target !== '' && r.target != null;
    var h = '<div class="hd"><span class="pill">第 ' + (i + 1) + ' 行 · 旧版</span>' +
      '<span class="tt">' + A.esc(r.section || '行动') + '</span></div>' +
      '<p class="task">' + A.esc(r.action || '') + '</p>' +
      '<div class="old">场景：' + A.esc(r.scene || '—') + '</div>';
    if (quantified) h += '<div class="old">量化目标：<b>' + A.esc(r.target) + '</b>' + (r.note ? ' · ' + A.esc(r.note) : '') + '</div>';
    h += '<div class="sec"><div class="lb done">填写成果</div>';
    h += '<label>结果影响</label>' + field(i, 'resultImpact', 'textarea', r.resultImpact, '用一两句话说清楚结果与影响');
    if (quantified) h += '<label>实际值</label>' + field(i, 'quantActual', 'input', r.quantActual, '目标 ' + (r.target || ''), ' inputmode="decimal"');
    h += '<label>遇到的困难（可选）</label>' + field(i, 'difficulty', 'textarea', r.difficulty, '执行中卡在哪？');
    h += '<label>未来怎么继续用（可选）</label>' + field(i, 'futureApplication', 'textarea', r.futureApplication, '下次还会怎么用？');
    h += '</div>';
    return h;
  }

  function render() {
    $('hClient').textContent = (data.project.client || '') + ' · ' + (data.project.cohort || '');
    $('hTitle').textContent = data.project.title || '课后迁移表';
    $('hStudent').textContent = '学员：' + (data.student.name || '');
    renderTimeline(data.project.schedule, 'student');
    $('cardsTitle').textContent = '我的 ' + rows.length + ' 张行动卡';

    var done = data.submission && data.submission.completed;
    if (done) {
      $('doneBox').classList.remove('hidden');
      $('doneBox').innerHTML = '你已于 <b>' + A.esc(data.submission.submittedAt || '此前') + '</b> 提交本次迁移。可直接查看，或改完后再点「提交迁移」覆盖更新。';
    }
    var body = $('fillBody'); body.innerHTML = '';
    rows.forEach(function (r, i) {
      var card = document.createElement('div');
      card.className = 'c2';
      card.innerHTML = A.isNewRow(r) ? newCardHTML(r, i) : legacyCardHTML(r, i);
      body.appendChild(card);
    });
    bindInputs(body);
  }

  function bindInputs(body) {
    body.querySelectorAll('input[data-f],textarea[data-f]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var i = +inp.getAttribute('data-i'), f = inp.getAttribute('data-f');
        rows[i][f] = inp.value;
        $('fillErr').textContent = '';
      });
    });
    /* 「用这句」只是把提示带进输入框，随时可改；默认留空，避免学员照抄讲师的答案 */
    body.querySelectorAll('[data-hint]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-i'), f = b.getAttribute('data-hint');
        var src = (f === 'scene') ? rows[i].hintScene : rows[i].hintBehavior;
        if (!src) return;
        rows[i][f] = String(src).replace(/^例如\s*[:：]?\s*/, '');
        var inp = body.querySelector('[data-i="' + i + '"][data-f="' + f + '"]');
        if (inp) inp.value = rows[i][f];
        $('fillErr').textContent = '';
      });
    });
  }

  function isComplete() {
    var ok = true;
    rows.forEach(function (r) {
      if (A.isNewRow(r)) {
        ['scene', 'behavior', 'metricName', 'baseline', 'goal', 'resultImpact', 'quantActual']
          .forEach(function (f) { if (String(r[f] == null ? '' : r[f]).trim() === '') ok = false; });
      } else {
        if ((r.resultImpact || '').trim() === '') ok = false;
        if (r.target !== '' && r.target != null && (r.quantActual === '' || r.quantActual == null)) ok = false;
      }
    });
    return ok;
  }

  $('btnSave').addEventListener('click', function () { submit(false); });
  $('btnSubmit').addEventListener('click', function () {
    if (!isComplete()) {
      $('fillErr').textContent = '每张卡都要填齐：工作场景、改善什么行为、指标（现在→想变成）、做成了什么和实际值。还没做完的可以先点「保存草稿」。';
      return;
    }
    submit(true);
  });

  function submit(completed) {
    A.saveSubmission(pid, tok, rows, completed).then(function (r) {
      if (!r || !r.ok) { toast('保存失败：' + ((r && r.error) || '未知')); return; }
      if (completed) {
        $('doneBox').classList.remove('hidden');
        $('doneBox').innerHTML = '✅ 已提交！你的直接上司会看到你定的四张卡与成果，讲师将在工作台看到完整迁移记录。感谢你的投入。';
        $('btnSubmit').disabled = true; $('btnSave').disabled = true;
        toast('提交成功');
      } else { toast('草稿已保存'); }
    }).catch(function (e) { toast('保存失败：' + (e.message || e)); });
  }
})();
</script>
</body>
</html>
